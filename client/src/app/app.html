<app-nav/>
<div class="card bg-base-100 w-1/2 mx-auto p-10 mt-10 shadow-xl">
<h3 class="text-3xl text-red-500">{{ title }}</h3>
<ul class="list">
  @for (member of members(); track member.id; let isLast = $last) {
    <li class="list-row items-center border-black-400 rounded-none" [class.border-b-2]="!isLast">
      <img src="/user.png" alt="User avatar" class="size-12 rounded-box">
      <div>{{member.displayName}}</div>
    </li>
  }
</ul>
</div>
